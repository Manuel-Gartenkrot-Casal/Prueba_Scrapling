services:

  scrapers:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - LMSTUDIO_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-mistral-7b-instruct-v0.3}
      - LMSTUDIO_EMB_MODEL=${LMSTUDIO_EMB_MODEL:-text-embedding-nomic-embed-text-v1.5}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-z-ai/glm-5.2}
      - NVIDIA_EMB_MODEL=${NVIDIA_EMB_MODEL:-nvidia/nv-embedqa-e5-v5}
      - MONGO_URI=${MONGO_URI}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    # Montamos el código Python para no rebuildear la imagen en cada cambio.
    volumes:
      - ./db.py:/app/db.py
      - ./flask_api.py:/app/flask_api.py
      - ./lm_studio.py:/app/lm_studio.py
      - ./embeddings.py:/app/embeddings.py
      - ./generar_articulo.py:/app/generar_articulo.py
      - ./scraper.py:/app/scraper.py
      - ./scheduler.py:/app/scheduler.py
      - ./add_url.py:/app/add_url.py
      - ./discover_sources.py:/app/discover_sources.py
      - ./run_automation.py:/app/run_automation.py
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  express:
    build:
      context: ./express
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SCRAPERS_URL=http://scrapers:5000
    volumes:
      - ./express/src/public:/app/dist/public
    depends_on:
      scrapers:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge
